<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="nipuna-grad" x1="2" y1="2" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#4f46e5" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Rounded Base Shield -->
  <rect x="2" y="2" width="28" height="28" rx="8" fill="url(#nipuna-grad)" filter="url(#glow)" />
  
  <!-- Subtle inner border -->
  <rect x="2.5" y="2.5" width="27" height="27" rx="7.5" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1" />
  
  <!-- Geometric N Emblem + Verification Check Motif -->
  <path 
    d="M9 22V10L17 19.5V10H20V22L12 12.5V22H9Z" 
    fill="#ffffff" 
    fill-rule="evenodd"
  />
  <circle cx="23" cy="9" r="3" fill="#10b981" stroke="#ffffff" stroke-width="1.5" />
</svg>
